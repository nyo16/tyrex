name: Precomp NIFs

on:
  push:
    branches:
      - master
    paths:
      - "native/**"
      - ".github/workflows/release.yml"
    tags:
      - "*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
  workflow_dispatch:

env:
  V8_TAG: "v146.4.0"
  # The NIF level *label* — not a switch. It is the value asserted in the
  # packaged archive name ("...-nif-2.16-...") and the bucket for the Rust build
  # cache key. Nothing reads it to configure a compiler: rustler removed env-var
  # NIF selection in 0.30, so the erl_nif API level is selected by the
  # `nif_version_2_16` Cargo feature on the `rustler` dependency in
  # native/tyrex/Cargo.toml. The two MUST be kept in agreement by hand — a
  # mismatch ships binaries whose name lies about their ABI, and
  # RustlerPrecompiled believes the name. The "Build the NIF" step asserts the
  # agreement so that drift fails the build instead of reaching users.
  NIF_VERSION: "2.16"

jobs:
  # Build V8 archives with shared-library-compatible TLS model.
  # V8's prebuilt static libraries use local-exec TLS (TPOFF32/TLSLE)
  # which is incompatible with shared libraries loaded via dlopen (NIFs).
  # Must build from the full rusty_v8 repo with v8_monolithic=true and
  # v8_monolithic_for_shared_library=true to get local-dynamic TLS.
  # Always runs on x86_64 — Chromium's internal toolchain (clang, rustc)
  # is x86_64-only. Cross-compiles for aarch64 using Chromium's clang + sysroot.
  build_v8:
    name: V8 archive - ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    steps:
      - name: Cache V8 archive
        id: v8-cache
        uses: actions/cache@v4
        with:
          path: /tmp/v8-archives/librusty_v8_${{ matrix.target }}.a
          key: v8-archive-${{ matrix.target }}-${{ env.V8_TAG }}-v4

      - name: Install build dependencies
        if: steps.v8-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 ninja-build pkg-config libglib2.0-dev git
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 20
          echo "LIBCLANG_PATH=/usr/lib/llvm-20/lib" >> $GITHUB_ENV
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
          fi

      - name: Install Rust toolchain
        if: steps.v8-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          targets: ${{ matrix.target }}

      - name: Clone rusty_v8
        if: steps.v8-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch ${{ env.V8_TAG }} --recurse-submodules \
            https://github.com/denoland/rusty_v8.git /tmp/v8build

      - name: Build V8 archive
        if: steps.v8-cache.outputs.cache-hit != 'true'
        working-directory: /tmp/v8build
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            mkdir -p .cargo
            printf '[target.aarch64-unknown-linux-gnu]\nlinker = "aarch64-linux-gnu-gcc"\n' > .cargo/config.toml
          fi

          export V8_FROM_SOURCE=1
          export EXTRA_GN_ARGS="v8_monolithic=true v8_monolithic_for_shared_library=true"
          export PRINT_GN_ARGS=1
          echo "Building V8 for ${{ matrix.target }}"
          echo "V8_FROM_SOURCE=$V8_FROM_SOURCE"
          echo "EXTRA_GN_ARGS=$EXTRA_GN_ARGS"

          # Build will fail at bindgen step (Chromium libc++ headers incompatible
          # with system libclang), but librusty_v8.a is produced before that.
          # We only need the .a file; bindings come from the rusty_v8 release.
          cargo build --release --target ${{ matrix.target }} 2>&1 || true

          ARCHIVE=$(find target/${{ matrix.target }}/release/gn_out -name "librusty_v8.a" 2>/dev/null | head -1)
          if [ -z "$ARCHIVE" ]; then
            ARCHIVE=$(find target/release/gn_out -name "librusty_v8.a" 2>/dev/null | head -1)
          fi
          if [ -z "$ARCHIVE" ]; then
            echo "ERROR: librusty_v8.a not found!"
            find target/ -name "librusty_v8*" 2>/dev/null
            exit 1
          fi

          # Note: the .a archive may still have TPOFF32 relocations even with
          # v8_monolithic_for_shared_library=true. This is normal — the linker
          # performs TLS relaxation when building the final .so. The meaningful
          # check is on the output NIF .so (done in build_nif job).
          echo "=== V8 archive info ==="
          ls -lh "$ARCHIVE"
          TPOFF=$(readelf -r "$ARCHIVE" 2>/dev/null | grep -c TPOFF32 || true)
          echo "TPOFF32 in archive: $TPOFF (will be resolved by linker)"

          mkdir -p /tmp/v8-archives
          cp "$ARCHIVE" /tmp/v8-archives/librusty_v8_${{ matrix.target }}.a
          ls -lh /tmp/v8-archives/librusty_v8_${{ matrix.target }}.a

      - name: Upload V8 archive
        uses: actions/upload-artifact@v5
        with:
          name: v8-archive-${{ matrix.target }}
          path: /tmp/v8-archives/librusty_v8_${{ matrix.target }}.a

  # Build NIF for all platforms.
  # macOS: uses prebuilt V8 from crates.io (no custom V8 build needed).
  # Linux: uses custom V8 archive from build_v8 job.
  build_nif:
    # The literal 2.16 is unavoidable here: GitHub Actions does not expose the
    # `env` context to a job `name:`. Every other occurrence is derived from
    # env.NIF_VERSION.
    name: NIF 2.16 - ${{ matrix.target }} (${{ matrix.os }})
    needs: [build_v8]
    # `always()` exists so the Linux legs still reach the guard step below and
    # report a clear error when build_v8 fails. It does not weaken the release
    # gate: the guard exits non-zero, so build_nif fails, so the `publish` job
    # (which has no `always()`) is skipped. Publishing stays all-or-nothing.
    if: always()
    runs-on: ${{ matrix.os }}

    permissions:
      # No `contents: write` — this job no longer publishes. Releases are cut
      # by the `publish` job below.
      contents: read
      id-token: write
      attestations: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin,      os: macos-14,         platform: macos }
          - { target: x86_64-apple-darwin,       os: macos-15,         platform: macos }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, platform: linux }
          - { target: x86_64-unknown-linux-gnu,  os: ubuntu-24.04,     platform: linux }

    steps:
      - name: Skip if V8 build failed (Linux only)
        if: matrix.platform == 'linux' && needs.build_v8.result != 'success'
        run: |
          echo "::error::V8 build failed, cannot build Linux NIF"
          exit 1

      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Extract project version
        shell: bash
        run: |
          echo "PROJECT_VERSION=$(sed -n 's/.*@version "\([^"]*\)".*/\1/p' mix.exs | head -n1)" >> $GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Add target
        shell: bash
        run: rustup target add ${{ matrix.target }}

      # --- Linux-specific steps ---

      - name: Download V8 archive
        if: matrix.platform == 'linux'
        uses: actions/download-artifact@v4
        with:
          name: v8-archive-${{ matrix.target }}
          path: /tmp/v8-archives

      - name: Download pre-generated V8 bindings
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          BINDING_FILE="src_binding_release_${{ matrix.target }}.rs"
          curl -L -o /tmp/v8-archives/$BINDING_FILE \
            "https://github.com/denoland/rusty_v8/releases/download/${{ env.V8_TAG }}/$BINDING_FILE"
          ls -lh /tmp/v8-archives/$BINDING_FILE

      - name: Configure V8 archive
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          ls -lh /tmp/v8-archives/
          ARCHIVE="/tmp/v8-archives/librusty_v8_${{ matrix.target }}.a"
          echo "RUSTY_V8_ARCHIVE=$ARCHIVE" >> $GITHUB_ENV
          echo "RUSTY_V8_SRC_BINDING_PATH=/tmp/v8-archives/src_binding_release_${{ matrix.target }}.rs" >> $GITHUB_ENV

          # Note: .a archive may have TPOFF32 — linker resolves them in final .so
          TPOFF=$(readelf -r "$ARCHIVE" 2>/dev/null | grep -c TPOFF32 || true)
          echo "TPOFF32 in archive: $TPOFF (will be resolved by linker)"

      - name: Install LLVM 20 (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libglib2.0-dev
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 20
          echo "LIBCLANG_PATH=/usr/lib/llvm-20/lib" >> $GITHUB_ENV

      # --- macOS-specific steps ---

      - name: Install LLVM 20 (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          brew install llvm
          LLVM_PREFIX="$(brew --prefix llvm)"
          echo "LIBCLANG_PATH=$LLVM_PREFIX/lib" >> $GITHUB_ENV
          echo "$LLVM_PREFIX/bin" >> $GITHUB_PATH

      # --- Common build steps ---

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v3-precomp
          shared-key: ${{ matrix.target }}-${{ env.NIF_VERSION }}
          workspaces: |
            native/tyrex

      - name: Build the NIF
        shell: bash
        run: |
          cd native/tyrex
          # env.NIF_VERSION only labels the archive. What actually fixes the
          # erl_nif API level is the rustler Cargo feature, so assert the two
          # agree before building: a silent disagreement here is how you ship a
          # binary whose filename promises an ABI it was not compiled against.
          FEATURE="nif_version_${NIF_VERSION//./_}"
          if ! grep -q "\"$FEATURE\"" Cargo.toml; then
            echo "::error::Cargo.toml does not enable the rustler feature $FEATURE, but archives are labelled nif-${NIF_VERSION}"
            grep -n rustler Cargo.toml || true
            exit 1
          fi
          echo "Building with rustler feature $FEATURE"
          cargo build --release --target ${{ matrix.target }}

      - name: Package NIF archive
        id: package-nif
        shell: bash
        run: |
          TARGET="${{ matrix.target }}"
          VERSION="${{ env.PROJECT_VERSION }}"

          # Determine library file name by platform
          if [[ "$TARGET" == *"apple"* ]]; then
            LIB_FILE="libtyrex.dylib"
          else
            LIB_FILE="libtyrex.so"
          fi

          SRC="native/tyrex/target/$TARGET/release/$LIB_FILE"
          if [ ! -f "$SRC" ]; then
            echo "::error::Built library not found at $SRC"
            ls -la native/tyrex/target/$TARGET/release/ || true
            exit 1
          fi

          # RustlerPrecompiled expects the file inside the tar to be named
          # libtyrex-v{version}-nif-{nif_version}-{target}.so (always .so)
          NIF_NAME="libtyrex-v${VERSION}-nif-${NIF_VERSION}-${TARGET}.so"
          ARCHIVE_NAME="${NIF_NAME}.tar.gz"

          TMPDIR=$(mktemp -d)
          cp "$SRC" "$TMPDIR/$NIF_NAME"
          tar -czf "$ARCHIVE_NAME" -C "$TMPDIR" "$NIF_NAME"
          rm -rf "$TMPDIR"

          CHECKSUM=$(shasum -a 256 "$ARCHIVE_NAME" | cut -d ' ' -f 1)

          echo "file-name=$ARCHIVE_NAME" >> $GITHUB_OUTPUT
          echo "file-path=$ARCHIVE_NAME" >> $GITHUB_OUTPUT
          echo "file-sha256=$CHECKSUM" >> $GITHUB_OUTPUT
          echo "=== Built: $ARCHIVE_NAME (sha256: $CHECKSUM) ==="
          ls -lh "$ARCHIVE_NAME"

      - name: Verify no TPOFF32 relocations
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          SO_FILE=$(find native/tyrex/target/${{ matrix.target }}/release -name "libtyrex.so" -type f | head -1)
          if [ -n "$SO_FILE" ]; then
            TPOFF=$(readelf -r "$SO_FILE" 2>/dev/null | grep -c TPOFF32 || true)
            echo "TPOFF32 relocations: $TPOFF"
            if [ "$TPOFF" -gt 0 ]; then
              echo "::error::TPOFF32 relocations found in output - V8 TLS model is wrong"
              exit 1
            fi
          fi

      - name: Artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ steps.package-nif.outputs.file-path }}

      - name: Artifact upload
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.package-nif.outputs.file-name }}
          path: ${{ steps.package-nif.outputs.file-path }}

  # Atomic publish. `needs: [build_nif]` with no `always()` means this job runs
  # only when every matrix leg succeeded, so a release can never contain a
  # partial set of archives. That matters because RustlerPrecompiled verifies
  # downloads against checksum-Elixir.Tyrex.Native.exs, which lists all four
  # targets — a missing archive yields a release that looks complete but is
  # broken for that target.
  publish:
    name: Publish release archives
    needs: [build_nif]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      # The version guards below read mix.exs and the checksum file, so this job
      # needs the tree. Nothing here needs history.
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Extract project version
        shell: bash
        run: |
          echo "PROJECT_VERSION=$(sed -n 's/.*@version "\([^"]*\)".*/\1/p' mix.exs | head -n1)" >> $GITHUB_ENV

      # Every archive name takes its v{version} from mix.exs, never from the tag.
      # Tagging v0.4.1 on a commit whose mix.exs says 0.4.0 attaches four
      # v0.4.0-named archives to the v0.4.1 release: the count guard below still
      # passes, and every consumer 404s. Identity before count — a version
      # mismatch makes the count guard's success meaningless.
      - name: Verify the tag matches mix.exs
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$TAG" != "v${PROJECT_VERSION}" ]; then
            echo "::error::Tag $TAG does not match mix.exs @version ${PROJECT_VERSION}; the archives are named v${PROJECT_VERSION}. Expected tag v${PROJECT_VERSION}."
            exit 1
          fi
          echo "Tag $TAG matches mix.exs @version ${PROJECT_VERSION}"

      - name: Download all NIF archives
        uses: actions/download-artifact@v4
        with:
          # Excludes the v8-archive-* artifacts uploaded by build_v8.
          pattern: libtyrex-*.tar.gz
          merge-multiple: true
          path: /tmp/nif-archives

      - name: Verify the full target set is present
        shell: bash
        run: |
          ls -lh /tmp/nif-archives
          COUNT=$(find /tmp/nif-archives -name '*.tar.gz' -type f | wc -l | tr -d ' ')
          EXPECTED=4  # must match the build_nif matrix
          if [ "$COUNT" -ne "$EXPECTED" ]; then
            echo "::error::Expected $EXPECTED NIF archives, found $COUNT — refusing to publish a partial release"
            exit 1
          fi

      - name: Publish archives and packages
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/nif-archives/*.tar.gz

      # Deliberately after the release step. checksum-Elixir.Tyrex.Native.exs is
      # packaged into the Hex tarball, and RustlerPrecompiled resolves the
      # artifact name and raises on a missing entry before it ever reaches the
      # network — so a stale file breaks all four precompiled targets identically
      # (v0.4.0 was cut while the file still held only v0.3.0 entries, and
      # nothing in the repo regenerated it). CI cannot fix it: the checksums are
      # of the archives the step above just uploaded, and CI must not commit.
      # Gating it before the release would deadlock, because the file can only be
      # generated from a release that does not exist yet. Failing after is safe:
      # attaching archives to a GitHub release is idempotent and reversible,
      # whereas `mix hex.publish` is not — and nothing in CI runs that. So a red
      # job here is exactly the forcing function, and it lands at the one moment
      # when the regeneration command can actually succeed.
      - name: Verify the checksum file covers this version
        shell: bash
        run: |
          FILE=checksum-Elixir.Tyrex.Native.exs
          if ! grep -q -- "-v${PROJECT_VERSION}-nif-" "$FILE"; then
            echo "::error::$FILE has no v${PROJECT_VERSION} entries — do NOT run mix hex.publish yet"
            echo "The v${PROJECT_VERSION} release and its four archives ARE published; nothing is missing on GitHub."
            echo "The remaining step is local and manual. Run it now that the release exists:"
            echo "  TYREX_BUILD=true mix rustler_precompiled.download Tyrex.Native --all --print"
            echo "  (wired up as: TYREX_BUILD=true mix checksums.after_release)"
            echo "then commit the regenerated $FILE and only then run mix hex.publish."
            exit 1
          fi
          echo "$FILE covers v${PROJECT_VERSION}:"
          grep -- "-v${PROJECT_VERSION}-nif-" "$FILE"
